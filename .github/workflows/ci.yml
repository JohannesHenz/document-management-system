name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  ocr-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # So the tests against the real Tesseract binary run instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Starts the full stack with Docker Compose and exercises it through the nginx proxy.
  end-to-end:
    needs: [backend, ocr-worker, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      - name: Upload, search, download and delete a document
        run: |
          set -euo pipefail
          echo "hello from CI" > smoke.txt
          id=$(curl -fsS -F file=@smoke.txt -F title="Smoke test" http://localhost:8080/api/documents | jq -r .id)
          curl -fsS "http://localhost:8080/api/documents?q=smoke" | jq -e 'length == 1'
          test "$(curl -fsS http://localhost:8080/api/documents/$id/content)" = "hello from CI"
          curl -fsS -X DELETE "http://localhost:8080/api/documents/$id"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Extract text from a scanned invoice and find it by its content
        run: |
          set -euo pipefail
          api=http://localhost:8080/api/documents
          id=$(curl -fsS -F file=@e2e/invoice-scan.png -F title="Scanned invoice" $api | jq -r .id)
          for i in $(seq 1 60); do
            status=$(curl -fsS $api/$id | jq -r .textStatus)
            [ "$status" != PENDING ] && break
            sleep 1
          done
          test "$status" = COMPLETED
          curl -fsS $api/$id/text | grep -q 'Rechnung Nr. 4711'
          # a typo still finds the document through Elasticsearch's fuzzy matching
          curl -fsS "$api?q=Gesamtbetrg" | jq -e --arg id "$id" 'map(.id) == [$id]'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
