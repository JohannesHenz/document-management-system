spring.application.name=dms-backend
server.port=8081

# Defaults to an in-memory H2 database so the API runs with no setup.
# Docker Compose overrides these with PostgreSQL via SPRING_DATASOURCE_* variables.
spring.datasource.url=jdbc:h2:mem:dms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
# Only report on RabbitMQ when OCR is enabled and the backend actually uses it.
management.health.rabbit.enabled=${dms.ocr.enabled}
management.health.elasticsearch.enabled=${dms.search.elasticsearch.enabled}

# Where uploaded files are kept: "filesystem" (default) or "minio" (S3-compatible object storage).
dms.storage.type=filesystem
# Directory for the filesystem storage (DMS_STORAGE_LOCATION overrides it).
dms.storage.location=./data/documents
# Object storage, used when dms.storage.type=minio.
dms.storage.minio.endpoint=http://localhost:9000
dms.storage.minio.access-key=
dms.storage.minio.secret-key=
dms.storage.minio.bucket=documents

# Text extraction by the OCR worker via RabbitMQ (spring.rabbitmq.* configures the connection).
dms.ocr.enabled=false
dms.ocr.content-types=application/pdf,image/png,image/jpeg,image/tiff
# A listener that throws sends the message to the dead-letter queue instead of redelivering it.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Full-text search: Elasticsearch when enabled (spring.elasticsearch.uris configures the connection),
# otherwise SQL LIKE queries against the database.
dms.search.elasticsearch.enabled=false
dms.search.elasticsearch.index=documents
