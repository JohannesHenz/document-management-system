spring.application.name=dms-ocr-worker
# A message-driven worker: no web server.
spring.main.web-application-type=none

# Connection settings come from SPRING_RABBITMQ_* in Docker Compose.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

dms.storage.minio.endpoint=http://localhost:9000
dms.storage.minio.access-key=
dms.storage.minio.secret-key=
dms.storage.minio.bucket=documents

dms.ocr.tesseract-command=tesseract
dms.ocr.languages=eng+deu
dms.ocr.dpi=300
dms.ocr.max-pages=50
dms.ocr.timeout-per-page=120s
